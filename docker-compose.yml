x-api-image: &api-image
  image: ai-agent-harness-api:local
  build:
    context: .
    dockerfile: docker/Dockerfile
x-database-env: &database-env
  - POSTGRES_HOST=postgres
  - POSTGRES_PORT=5432
  - POSTGRES_DB=${POSTGRES_DB:-agentdb}
  - POSTGRES_USER=${POSTGRES_USER:-agent}
  - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your environment}

services:
  api:
    <<: *api-image
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-agentdb}
      - POSTGRES_USER=${POSTGRES_USER:-agent}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or your environment}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=${REDIS_ENABLED:-true}
      - REDIS_KEY_PREFIX=${REDIS_KEY_PREFIX:-agent-harness}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - WEATHER_CACHE_TTL_SECONDS=${WEATHER_CACHE_TTL_SECONDS:-120}
      - MAX_REQUEST_BODY_BYTES=${MAX_REQUEST_BODY_BYTES:-262144}
      - API_ALLOWED_TOOLS=${API_ALLOWED_TOOLS:-["calculator","datetime","weather"]}
      - API_TOKEN=${API_TOKEN:-}
      - API_USER_ID=${API_USER_ID:-local}
      - APPROVAL_REQUIRED_TOOLS=${APPROVAL_REQUIRED_TOOLS:-[]}
      - MAX_AGENT_STEPS=${MAX_AGENT_STEPS:-10}
      - MAX_TOOL_CALLS=${MAX_TOOL_CALLS:-5}
      - MAX_RETRIES=${MAX_RETRIES:-2}
      - AGENT_TIMEOUT_SECONDS=${AGENT_TIMEOUT_SECONDS:-120}
      - MEMORY_RETRIEVAL_LIMIT=${MEMORY_RETRIEVAL_LIMIT:-5}
      - MEMORY_MIN_SIMILARITY=${MEMORY_MIN_SIMILARITY:-0.5}
      - MAX_CONVERSATION_TURNS=${MAX_CONVERSATION_TURNS:-20}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      ollama-models:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *api-image
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *database-env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment: *database-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-models:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma4:e4b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for model in "$${OLLAMA_MODEL}" "$${OLLAMA_EMBEDDING_MODEL}"; do
          if ! ollama show "$$model" >/dev/null 2>&1; then
            ollama pull "$$model"
          fi
        done
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  ollama-data:
