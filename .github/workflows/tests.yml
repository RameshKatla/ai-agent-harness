name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: agentdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U agent -d agentdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_DB: agentdb
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_POSTGRES_TESTS: "1"
      RUN_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app migrations scripts tests
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q
